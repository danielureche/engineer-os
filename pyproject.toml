[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineer-os"
version = "0.1.0"
description = "Engineering productivity and diagnostics CLI"
requires-python = ">=3.11"

dependencies = [
    "rich>=13.0",
]

[project.scripts]
engineer = "engineer.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]